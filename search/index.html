<style>
  :root{
    --paper:#F3EBDB; --paper-2:#FBF6EA; --card:#FCF8EF;

  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--grot);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 56px;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:var(--syne);font-weight:800;line-height:1.02;letter-spacing:-.018em;}
  .eyebrow{font-family:var(--jost);font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--scarlet-deep);}
  .foil{background-image:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  nav{position:sticky;top:0;z-index:50;background:rgba(243,235,219,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:15px 56px;max-width:1280px;margin:0 auto;}
  .brand{display:inline-flex;align-items:center;gap:11px;}

  .brand-sur{font-family:var(--jost);font-weight:600;font-size:12px;letter-spacing:.36em;color:var(--gold-deep);padding-top:2px;}
  .nav-links{display:flex;gap:28px;align-items:center;}
  .nav-links a{font-family:var(--jost);font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--ink-soft);transition:.18s;}

  .nav-sub{font-size:12.5px!important;font-weight:700!important;color:#fff!important;background:var(--scarlet);padding:10px 20px;border-radius:40px;transition:.2s;letter-spacing:.04em;}

  .kp-foot{background:var(--paper-2);border-top:1px solid var(--line);padding:40px 0 30px;margin-top:40px;font-family:var(--jost);font-size:12.5px;color:var(--ink-soft);text-align:center}
  .kp-foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin-bottom:14px;font-weight:600;font-size:13px}
  .kp-foot a{color:var(--ink-soft)} .kp-foot a:hover{color:var(--scarlet)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .rd-hero{padding:64px 0 22px;}
  .rd-hero h1{font-size:clamp(40px,7vw,72px);text-transform:uppercase;margin:16px 0 14px;}
  .rd-hero p{font-size:18px;color:var(--ink-soft);max-width:620px;}
  .rd-h2{font-family:var(--jost);font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);}
  /* search UI (shared by /read/ and /search/) */
  .rd-search{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}
  .rd-search label{width:100%;font-family:var(--jost);font-size:13px;font-weight:600;color:var(--ink-soft);}
  .rd-search input{flex:1 1 260px;min-width:0;font:500 17px/1.3 var(--grot);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:40px;padding:13px 20px;}
  .rd-search input:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold);}
  .rd-search button{font-family:var(--jost);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--scarlet);border:0;border-radius:40px;padding:14px 24px;cursor:pointer;}
  .rd-search button:hover{background:var(--scarlet-deep);}
  .sr-count{font-family:var(--jost);font-size:13px;font-weight:600;color:var(--ink-soft);margin:18px 0 6px;}
  .sr-list{list-style:none;display:grid;gap:12px;margin-top:10px;}
  .sr-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;}
  .sr-link{display:block;}
  .sr-meta{display:block;font-family:var(--jost);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--scarlet-deep);margin-bottom:4px;}
  .sr-title{display:block;font-family:var(--syne);font-weight:800;font-size:20px;line-height:1.15;}
  .sr-link:hover .sr-title{color:var(--scarlet-deep);}
  .sr-snip{font-size:15px;color:var(--ink-soft);margin-top:6px;line-height:1.55;}
  .sr-item mark{background:var(--champ);color:var(--ink);border-radius:3px;padding:0 2px;}
  .sr-more{margin-top:12px;font-family:var(--jost);font-weight:700;font-size:14px;}
  .sr-more a,.sr-empty a,.sr-count a{color:var(--scarlet-deep);text-decoration:underline;text-underline-offset:3px;}
  .sr-empty{color:var(--ink-soft);margin-top:8px;}
  .rd-results-wrap{padding:6px 0 40px;min-height:40vh;}

  @media (max-width:820px){.wrap{padding:0 20px;}.nav-in{padding:13px 20px;}.brand-sur{display:none;}.rd-hero{padding:40px 0 14px;}.rd-hero h1{font-size:clamp(26px,8.2vw,42px);overflow-wrap:normal;}.rd-hero p{font-size:16.5px;}}
